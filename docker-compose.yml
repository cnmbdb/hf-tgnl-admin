services:
  app:
    image: ghcr.io/cnmbdb/tgnl-admin:latest
    container_name: ${APP_CONTAINER_NAME:-tgnl-admin-app}
    working_dir: /app
    volumes:
      - ./.env:/app/.env
      - ./nl-2333/config.txt:/app/nl-2333/config.txt
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    env_file:
      - .env
    environment:
      # 容器内部固定值，不受宿主机 shell 变量干扰
      - DB_HOST=db
      - DB_PORT=3306
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/admin/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.0
    container_name: tgnl-admin-db
    restart: unless-stopped
    env_file:
      - .env
    # MYSQL_ROOT_PASSWORD 和 MYSQL_DATABASE 直接由 env_file 中的
    # MYSQL_ROOT_PASSWORD / DB_NAME 注入，无需 ${} 插值
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./nl-admin.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bot:
    image: ghcr.io/cnmbdb/tgnl-admin-bot:latest
    container_name: ${BOT_CONTAINER_NAME:-tgnl-admin-bot}
    working_dir: /app
    volumes:
      - ./.env:/app/.env:ro
      - ./nl-2333/config.txt:/app/config.txt
      - ./nl-2333/logs:/app/logs
    env_file:
      - .env
    environment:
      # 容器内部固定值
      - DB_HOST=db
      - DB_PORT=3306
      - APP_HOST=app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - tgnl_home_default
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  cftun:
    image: cloudflare/cloudflared:latest
    container_name: ${CFTUN_CONTAINER_NAME:-tgnl-admin-cftun}
    restart: "no"
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CFTUN_TOKEN}"]
    env_file:
      - .env
    depends_on:
      bot:
        condition: service_started
    networks:
      - default

volumes:
  db_data:

networks:
  default:
    name: tgnl-admin_default
  tgnl_home_default:
    name: tgnl-home_default
