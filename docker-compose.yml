services:
  app:
    image: ghcr.io/cnmbdb/tgnl-admin:latest
    pull_policy: always
    container_name: ${APP_CONTAINER_NAME:-tgnl-admin-app}
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./.env:/app/.env
      - ./nl-2333/config.txt:/app/nl-2333/config.txt
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=db
      - DB_PORT=3306
      - APP_BASE_PATH=/admin
      - NODE_ENV=production
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - PORT=3000
      - NITRO_PORT=3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/admin/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER_NAME:-tgnl-admin-db}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./nl-admin.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bot:
    image: ghcr.io/cnmbdb/tgnl-admin-bot:latest
    pull_policy: always
    container_name: ${BOT_CONTAINER_NAME:-tgnl-admin-bot}
    working_dir: /app
    volumes:
      - ./.env:/app/.env:ro
      - ./nl-2333/config.txt:/app/config.txt
      - ./nl-2333/logs:/app/logs
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=db
      - DB_PORT=3306
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-tgnl}
      - PORT=3000
      - APP_BASE_PATH=/admin
      - APP_HOST=app
      - BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL:-}
      - BOT_WEBHOOK_PORT=${BOT_WEBHOOK_PORT:-8443}
      - BOT_WEBHOOK_PATH=${BOT_WEBHOOK_PATH:-webhook}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - tgnl_home_default
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  cftun:
    image: cloudflare/cloudflared:latest
    container_name: ${CFTUN_CONTAINER_NAME:-tgnl-admin-cftun}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CFTUN_TOKEN}"]
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CFTUN_TOKEN:-}
      - CFTUN_TUNNEL_ID=${CFTUN_TUNNEL_ID:-}
    depends_on:
      bot:
        condition: service_started
    networks:
      - default

volumes:
  db_data:

networks:
  default:
    name: ${APP_CONTAINER_NAME:-tgnl-admin}_default
  tgnl_home_default:
    name: tgnl-home_default
    external: true
